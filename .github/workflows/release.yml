# Tag-driven release: universal .app -> sign (or ad-hoc) -> zip + dmg -> provenance -> GitHub Release.
#
#   git tag -a v0.3.0 -m "v0.3.0" && git push origin v0.3.0
#
# Required secrets for a signed, notarized build (issue #5). When they are
# absent the workflow still publishes, ad-hoc signed, with a loud warning — an
# unsigned build is a worse product, not a broken pipeline:
#   DEVELOPER_ID_P12             base64 of the "Developer ID Application" .p12
#   DEVELOPER_ID_P12_PASSWORD    password of that .p12
#   KEYCHAIN_PASSWORD            password for the temporary keychain
#   DEVELOPER_IDENTITY           e.g. "Developer ID Application: Name (TEAMID)"
# Optional, enables notarization + stapling:
#   APPLE_ID / APPLE_TEAM_ID / APPLE_APP_PASSWORD
#
# Release notes come from `.github/release.yml` categories via --generate-notes.
# Never restate the changelog here.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and publish (e.g. v0.3.0)'
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

# One release at a time; never cancel a half-finished publish.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  release:
    name: Build and publish
    runs-on: macos-15
    timeout-minutes: 45
    env:
      APP_NAME: Fillline
      TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # A manual run must build the tagged tree, not whatever main happens to be.
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          tag="$TAG"
          case "$tag" in
            v*) version="${tag#v}" ;;
            *) version="$tag" ;;
          esac
          if [ -z "$version" ]; then
            echo "::error::could not resolve a version from tag '$tag'"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Releasing $tag (version $version)"

      # Homebrew downloads are the slow part; the bottle itself is cached.
      - name: Cache Homebrew
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew/downloads
          key: brew-${{ runner.os }}-xcodegen-2.46.0
          restore-keys: |
            brew-${{ runner.os }}-xcodegen-

      - name: Install XcodeGen
        run: |
          set -euo pipefail
          command -v xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen --version

      - name: Generate project
        run: xcodegen generate

      - name: Build (universal, unsigned)
        run: |
          set -euo pipefail
          xcodebuild \
            -project "$APP_NAME.xcodeproj" \
            -scheme "$APP_NAME" \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      # The tag must not publish a package that would fail its own gates.
      - name: Test
        id: tests
        run: |
          set -o pipefail
          ./Scripts/test-local.sh 2>&1 | tee "$RUNNER_TEMP/tests.log"
          count=$(grep -oE 'Test run with [0-9]+ test' "$RUNNER_TEMP/tests.log" | tail -n 1 \
            | grep -oE '[0-9]+' || true)
          echo "count=${count:-unknown}" >> "$GITHUB_OUTPUT"
          echo "Executed ${count:-unknown} tests"

      - name: Sign
        id: sign
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          DEVELOPER_IDENTITY: ${{ secrets.DEVELOPER_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          app="build/Build/Products/Release/$APP_NAME.app"
          if [ ! -d "$app" ]; then
            echo "::error::expected app bundle at $app"
            exit 1
          fi
          echo "Architectures: $(lipo -archs "$app/Contents/MacOS/$APP_NAME")"

          if [ -n "${DEVELOPER_ID_P12:-}" ] && [ -n "${DEVELOPER_ID_P12_PASSWORD:-}" ] \
             && [ -n "${KEYCHAIN_PASSWORD:-}" ] && [ -n "${DEVELOPER_IDENTITY:-}" ]; then
            echo "==> Signing mode: Developer ID ($DEVELOPER_IDENTITY)"
            keychain="$RUNNER_TEMP/app-signing.keychain-db"
            echo "$DEVELOPER_ID_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
            security set-keychain-settings -lut 21600 "$keychain"
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
            security import "$RUNNER_TEMP/cert.p12" -k "$keychain" \
              -P "$DEVELOPER_ID_P12_PASSWORD" -A -t cert -f pkcs12
            security set-key-partition-list -S apple-tool:,apple: \
              -k "$KEYCHAIN_PASSWORD" "$keychain" >/dev/null
            # shellcheck disable=SC2046
            security list-keychains -d user -s $(security list-keychains -d user | tr -d '"') "$keychain"

            codesign --deep --force --options runtime --timestamp \
              --sign "$DEVELOPER_IDENTITY" "$app"
            codesign --verify --deep --strict --verbose=2 "$app"

            if [ -n "${APPLE_ID:-}" ] && [ -n "${APPLE_TEAM_ID:-}" ] && [ -n "${APPLE_APP_PASSWORD:-}" ]; then
              echo "==> Notarizing and stapling"
              ditto -c -k --keepParent "$app" "$RUNNER_TEMP/notarize.zip"
              xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
                --apple-id "$APPLE_ID" \
                --team-id "$APPLE_TEAM_ID" \
                --password "$APPLE_APP_PASSWORD" \
                --wait
              xcrun stapler staple "$app"
              xcrun stapler validate "$app"
              spctl -a -vvv "$app"
              echo "mode=Developer ID (notarized)" >> "$GITHUB_OUTPUT"
            else
              echo "::warning::notarization secrets absent — signed but not notarized"
              echo "mode=Developer ID (not notarized)" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "::warning::ad-hoc signed (Developer ID secrets absent) — issue #5"
            codesign --force --deep --sign - "$app"
            echo "mode=ad-hoc" >> "$GITHUB_OUTPUT"
          fi

      - name: Package
        id: package
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          app="build/Build/Products/Release/$APP_NAME.app"
          base="$APP_NAME-$version-macos-universal"
          mkdir -p dist

          ditto -c -k --keepParent "$app" "dist/$base.zip"

          stage="$RUNNER_TEMP/dmg-root"
          rm -rf "$stage"
          mkdir -p "$stage"
          cp -R "$app" "$stage/"
          ln -s /Applications "$stage/Applications"
          hdiutil create -volname "$APP_NAME" -srcfolder "$stage" \
            -ov -format UDZO "dist/$base.dmg" >/dev/null

          echo "zip=dist/$base.zip" >> "$GITHUB_OUTPUT"
          echo "dmg=dist/$base.dmg" >> "$GITHUB_OUTPUT"
          {
            echo "zip_sha=$(shasum -a 256 "dist/$base.zip" | awk '{print $1}')"
            echo "dmg_sha=$(shasum -a 256 "dist/$base.dmg" | awk '{print $1}')"
          } >> "$GITHUB_OUTPUT"
          shasum -a 256 dist/*

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.zip
            dist/*.dmg

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$TAG"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            # Notes come from .github/release.yml categories — do not duplicate them.
            gh release create "$tag" --title "$tag" --generate-notes --verify-tag
          fi
          gh release upload "$tag" \
            "${{ steps.package.outputs.zip }}" \
            "${{ steps.package.outputs.dmg }}" \
            --clobber

      - name: Summary
        if: always()
        run: |
          {
            echo "## Fillline ${{ steps.version.outputs.version }}"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Tag | \`$TAG\` |"
            echo "| Version | \`${{ steps.version.outputs.version }}\` |"
            echo "| Signing | ${{ steps.sign.outputs.mode || 'not attempted' }} |"
            echo "| Tests | ${{ steps.tests.outputs.count || 'unknown' }} |"
            echo "| Zip SHA-256 | \`${{ steps.package.outputs.zip_sha || '—' }}\` |"
            echo "| DMG SHA-256 | \`${{ steps.package.outputs.dmg_sha || '—' }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
