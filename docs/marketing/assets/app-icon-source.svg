<?xml version="1.0" encoding="UTF-8"?>
<!--
  Fillline — app icon master

  CONCEPT
    The fill line on a tank. The tile is the tank plate; a rounded glass window in it
    shows how much quota is left as a rust volume, and the level is drawn as one bright
    horizontal line that overshoots the window on both sides — the same tick that
    overshoots every meter in the popover, grown up.
    No letters, no provider marks, no needle, no second accent.

  GRID (1024 x 1024, full bleed)
    tile      superellipse, centre 512,512, n=4.6, r=512     (≈22 % corner radius feel)
    window    x 128..896, y 168..856, rx 128                 (768 x 688)
    level     y 402 = 66 % of the window height, measured from the floor
    line      x 64..960, y 370..434 (h 64), square ends
              → overshoots the window by 64 units on each side
    ground    everything sits on the 8-unit grid; the only curves are tile + window

  COLOURS (sRGB — paper / ink / rust from docs/design/ui.md, warmed for dark)
    paper   #F2EFE8   the fill line, window glass          light: #FDFAF3 → #DED8C9
    ink     #1A1915   palette ink                          tile:  #302B25 → #100F0C
    rust    #A6432A   palette rust                         liquid:#D8763F → #9E3E26

  REBUILD
    See docs/marketing/assets/README.md. Rasterise this file at 1024 x 1024 with Chrome
    headless, then downsample to the iconset; never re-export a small size by hand.
    The squircle is a Catmull-Rom fit of the parametric superellipse — regenerate the
    path instead of editing its numbers.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="Fillline">
  <title>Fillline app icon</title>
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#332D26"/>
      <stop offset="0.40" stop-color="#1F1C18"/>
      <stop offset="1" stop-color="#100F0C"/>
    </linearGradient>

    <radialGradient id="lamp" cx="0.5" cy="0.74" r="0.54">
      <stop offset="0" stop-color="#A6432A" stop-opacity="0.26"/>
      <stop offset="0.60" stop-color="#A6432A" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#A6432A" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="liquid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D2703F"/>
      <stop offset="0.32" stop-color="#C05B36"/>
      <stop offset="1" stop-color="#A6432A"/>
    </linearGradient>

    <linearGradient id="fill" x1="0" y1="384" x2="0" y2="448" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FEFBF4"/>
      <stop offset="0.30" stop-color="#F5F2EA"/>
      <stop offset="1" stop-color="#DAD3C2"/>
    </linearGradient>

    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="0.26" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#080706" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#080706" stop-opacity="0.12"/>
    </linearGradient>

