0.81 253.34 1022.09 300.75 C 1023.37 348.17 1024.00 441.58 1024.00 512.00 Z"/>
    </clipPath>

    <clipPath id="windowClip">
      <rect x="192" y="148" width="640" height="728" rx="176"/>
    </clipPath>
  </defs>

  <g clip-path="url(#tileClip)">
    <!-- tank plate -->
    <rect width="1024" height="1024" fill="url(#plate)"/>
    <rect width="1024" height="1024" fill="url(#lamp)"/>

    <!-- the sight glass: empty headroom above the level -->
    <rect x="192" y="148" width="640" height="728" rx="176" fill="url(#glass)"/>

    <!-- remaining quota behind the glass -->
    <g clip-path="url(#windowClip)">
      <rect x="192" y="448" width="640" height="428" fill="url(#liquid)"/>
      <rect x="192" y="448" width="640" height="12" fill="#2A0D06" opacity="0.28"/>
      <rect x="192" y="448" width="640" height="428" fill="url(#plate)" opacity="0.10"/>
      <rect x="192" y="148" width="640" height="728" rx="176" fill="none"
            stroke="#F2EFE8" stroke-opacity="0.15" stroke-width="7"/>
    </g>

    <!-- THE FILL LINE: meniscus inside the walls, thin sight mark outside them -->
    <g fill="url(#fill)">
      <rect x="192" y="384" width="640" height="64"/>
      <rect x="144" y="404" width="736" height="24"/>
    </g>

